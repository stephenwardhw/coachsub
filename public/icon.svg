<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background with safe padding for maskable -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  <!-- Inner pitch -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="url(#pitchGrad)" stroke="#34d399" stroke-width="6" stroke-opacity="0.4" />
  <!-- Half field line & arc -->
  <line x1="56" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-width="6" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.8" />
  <rect x="186" y="56" width="140" height="70" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.8" />
  <rect x="220" y="56" width="72" height="28" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.8" />
  <!-- Substitution arrows & Jersey badge -->
  <circle cx="210" cy="340" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="5" />
  <text x="210" y="348" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">#10</text>
  <!-- Incoming staged sub badge -->
  <circle cx="270" cy="300" r="38" fill="#10b981" stroke="#ffffff" stroke-width="4" />
  <text x="270" y="307" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">#7</text>
  <!-- Green sub arrow -->
  <path d="M 235 295 Q 248 275 260 285" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
</svg>
